<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper · 实时 Shader</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#e7edf7;font-family:Arial,sans-serif}#surface{position:absolute;inset:0}#surface canvas{display:block;width:100%;height:100%}.tools{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#080b12bb;backdrop-filter:blur(15px);border:1px solid #ffffff20;border-radius:6px;font-size:10px}.tools button,.tools select{color:inherit;border:1px solid #ffffff40;background:#101620;border-radius:4px;padding:5px;font:inherit}.tools label{display:flex;align-items:center;gap:5px}.tools input{width:65px;accent-color:#a9baff}.tools a{color:#dce4fa;margin-left:auto;font-size:9px}#hint{position:absolute;bottom:65px;left:14px;font-size:10px;color:#cdd8ecaa;pointer-events:none}#error{position:absolute;inset:0;display:grid;place-content:center;padding:25px;text-align:center;font-size:12px;line-height:1.8;background:#080b12}#error:empty{display:none}body.still .tools,body.still #hint{display:none}@media(max-width:300px){.tools{gap:5px;flex-wrap:wrap}.tools a{display:none}.tools input{width:50px}}
</style></head><body>
<div id="surface"></div><p id="hint">移动指针改变纹理位置</p>
<div class="tools"><button id="pause" aria-label="暂停动画">暂停</button><label>速度 <input id="speed" type="range" min="0" max="2" step="0.05" value="0.4"></label><select id="palette" aria-label="配色"><option value="blue">冰蓝</option><option value="violet">紫光</option><option value="warm">暖光</option></select><a id="source" target="_blank" rel="noopener">Paper 原作 ↗</a></div>
<div id="error" role="status"></div>
<script type="module" src="paper.js"></script></body></html>
